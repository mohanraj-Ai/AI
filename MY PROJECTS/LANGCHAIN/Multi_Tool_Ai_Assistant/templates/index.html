<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Multi-Tool AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            height: 90vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px;
        }

        .header h1 {
            font-size: 24px;
        }

        .header p {
            margin-top: 5px;
            font-size: 14px;
            color: #d1d5db;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 15px;
            border-radius: 10px;
            max-width: 80%;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .user {
            background: #dbeafe;
            margin-left: auto;
        }

        .ai {
            background: #f3f4f6;
            margin-right: auto;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        #sendButton {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #sendButton:hover {
            background: #1d4ed8;
        }

        #sendButton:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Multi-Tool AI Assistant</h1>
            <p>LangGraph + Gemini + Multiple Tools</p>
        </div>

        <div class="chat-box" id="chatBox">

            <div class="message ai">
                Hello! I am your Multi-Tool AI Assistant. How can I help you?
            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Ask me something..."
                autocomplete="off"
            >

            <button id="sendButton">
                Send
            </button>

        </div>

    </div>


    <script>

        const messageInput = document.getElementById("messageInput");
        const sendButton = document.getElementById("sendButton");
        const chatBox = document.getElementById("chatBox");


        function addMessage(text, type) {

            const message = document.createElement("div");

            message.classList.add("message");
            message.classList.add(type);

            message.textContent = text;

            chatBox.appendChild(message);

            chatBox.scrollTop = chatBox.scrollHeight;
        }


        async function sendMessage() {

            const message = messageInput.value.trim();

            if (!message) {
                return;
            }

            // Show user message
            addMessage(message, "user");

            // Clear input
            messageInput.value = "";

            // Disable button while waiting
            sendButton.disabled = true;
            sendButton.textContent = "Thinking...";


            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                });


                const data = await response.json();

                // Show AI response
                addMessage(data.response, "ai");


            } catch (error) {

                addMessage(
                    "Error connecting to the server.",
                    "ai"
                );

                console.error(error);

            }


            // Enable button again
            sendButton.disabled = false;
            sendButton.textContent = "Send";

            messageInput.focus();
        }


        // Send when button is clicked
        sendButton.addEventListener(
            "click",
            sendMessage
        );


        // Send when Enter key is pressed
        messageInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    sendMessage();
                }

            }
        );

    </script>

</body>

</html>
